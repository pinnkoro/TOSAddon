name: Claude Code Review

# PR が開かれたとき / 更新されたときに、Claude Code の code-review スキルを走らせて
# 指摘をインラインコメントとして貼る。ci.yml が「配布物を壊す事故」を機械的に止めるのに対し、
# こちらは人間のレビュアーが 1 人しか居ない（ソロ開発）ぶんを補うのが目的。
#
# 前提:
#   * repo secret `CLAUDE_CODE_OAUTH_TOKEN` に、手元で `claude setup-token` して得た
#     トークンを入れておく。これを使うと API 従量課金ではなくサブスクリプション枠で走る。
#     （API キー方式にするなら `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` に差し替え）
#   * 公開リポジトリなので、fork から出た PR には secret が渡らずレビューは走らない。
#     自分のブランチから出す通常の PR だけが対象になる。
#
# 注意: このジョブを ruleset の必須ステータスチェックに足さないこと。
#   fork PR では起動しないうえ、レビューはマージの可否を判断する検査ではないため。
#   （ci.yml 冒頭の `ipf` ジョブを必須にしない理由と同じ）

on:
  pull_request:
    types: [opened, synchronize]

# 同じ PR に立て続けに push したとき、古いレビューは打ち切る（無駄な消費を減らす）。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # fork からの PR は secret が空になり、認証エラーで必ず赤くなるだけなので最初から回さない。
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # --comment でインラインコメントを投稿するため
      issues: read
      id-token: write # claude-code-action の GitHub App 認証に必要
    steps:
      # CLAUDE.md と src を読ませるため。diff を取るので浅いクローンにはしない。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
