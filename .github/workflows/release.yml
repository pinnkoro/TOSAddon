name: Release

# release ブランチへの push(= main -> release のマージ)を検知して、配布用リリースを更新する。
# 運用: 新規ブランチ -> main に直接マージ。公開したいタイミングで main -> release にマージする。
#
# ■ 対象は addons.json の全エントリ（1 リポジトリに複数アドオンを収録している）
#
# 配布物は 1 本ではない（Nexus Addons P / Icor Planner）。対象の一覧と、そこから導く
# タグ名・アセット名・.ipf のファイル名は docs/addon_targets.py が持つ（--json で出す）。
# ここで名前を組み立て直すと、検証スクリプトと食い違ったまま公開されることになる。
#
# ■ 「版が変わったものだけ」公開する
#
# 片方だけ直した PR でも release へのマージは 1 回なので、素直に全部作り直すと
# **何も変えていないアドオンのリリースまで作り直され**、リリースノートと更新日が
# 無関係な内容に差し替わる（アドオンマネージャーは更新日を移動タグの .atom から取る）。
# そこで「移動タグの Release に付いているアセット名」と「addons.json の fileVersion から
# 組み立てたアセット名」を比べ、**違うものだけ**を公開する。git の差分ではなく
# 公開済みの実物と比べるので、取りこぼしも二重公開も起きない。
#
# ■ タグは 2 種類
#
# 移動タグ (= addons.json の releaseTag = file)
#   アドオンマネージャーの取得先。毎回タグごと作り直してアセットを差し替える。
#   作り直す = 前回のリリースノートとアセットが消える。
# 保存用タグ (<file>-vX.Y.Z)
#   過去版を後から辿るための記録用。マネージャーからは参照されない。
#   版番号だけ(v1.0.0)にすると 2 本目のアドオンと衝突するので <file>- を付ける
#   (v1.0.0〜v2.10.0 の既存タグは Nexus Addons P の過去の記録。そのまま残す)。
#
# リリースノートは release へのマージ元 PR(main -> release)の本文をそのまま流用する。
# (PR を介さずローカルマージで push した場合は本文が無いので既定ノートにフォールバック)
# 公開したら、リリースノートの日本語セクションだけを Discord のチャンネルにも投稿する
# (docs/post_release_discord.py。Webhook の URL は Secret の DISCORD_WEBHOOK_URL)。

on:
  push:
    branches: [release] # main -> release のマージを push として検知
  workflow_dispatch: # 手動でも同じ処理を再実行できるようにする
    inputs:
      addons:
        description: "公開し直すアドオンの file をカンマ区切りで（空なら版が変わったものだけ）"
        type: string
        default: ""
      discord:
        description: "Discord にも投稿する（手動の再実行は既定で投稿しない。二重投稿を防ぐため）"
        type: boolean
        default: false

permissions:
  contents: write # Release / タグの作成・削除
  pull-requests: read # マージ元 PR の本文取得

jobs:
  # 何を公開するかだけを決める。実際の公開は release ジョブが 1 アドオンずつ行う。
  plan:
    # release ブランチ自体の新規作成(github.event.created)では走らせない。
    # 作成時の push は「何もマージしていない」ため紐づく PR が無く、リリースノートが
    # 既定文にフォールバックした空リリースが 1 本できてしまう。ブランチを用意する
    # 操作と公開する操作を分けたいので、作成だけは素通りさせる。
    # (workflow_dispatch では github.event.created が未定義 = 手動実行は従来どおり通る)
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7

      - name: 公開が要るアドオンを選ぶ
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # 手動実行で明示されたものは、版が同じでも作り直す（ノートの修正 / 取り直し用）
          FORCE_ADDONS: ${{ inputs.addons }}
        # 判定の中身は docs/plan_release.py（手元でも同じものを流して確かめられる）。
        # matrix / any を $GITHUB_OUTPUT へ書く。
        run: python3 docs/plan_release.py

  release:
    needs: plan
    # 公開対象が 0 件なら何もしない（空の include を matrix に渡すとエラーになる）。
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 片方の公開が落ちても、もう片方は公開する
      # 同じコミットに対してタグを作る処理が並ぶと gh / git 側で競合しうるので直列にする。
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: .ipf / リリースノートを解決
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON_DIR: ${{ matrix.dir }}
          ADDON_IPF: ${{ matrix.ipf }}
          ADDON_ASSET: ${{ matrix.asset }}
          ADDON_TITLE: ${{ matrix.title }}
          ADDON_VERSION: ${{ matrix.version }}
          ARCHIVE_TAG: ${{ matrix.archive_tag }}
        run: |
          set -euo pipefail

          # 名前は docs/addon_targets.py が addons.json から組み立てたものをそのまま使う。
          # 実物が無い = 採番と .ipf の差し替えが食い違っている（本来は ipf ジョブが
          # release への PR で止めているので、ここに来る時点で異常）。
          ipf="${ADDON_DIR}/${ADDON_IPF}"
          [ -f "$ipf" ] || { echo "::error::$ipf が無い（addons.json の fileVersion と .ipf のファイル名が食い違っている）"; exit 1; }
          cp -- "$ipf" "${RUNNER_TEMP}/${ADDON_ASSET}"

          # リリースノート: このコミットに紐づく(マージ済み)PR の本文を流用
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].body // ""' > "${RUNNER_TEMP}/notes.md" || : > "${RUNNER_TEMP}/notes.md"
          # jq は空でも改行を出すため、空白のみ(= 実質空)なら既定ノートに差し替える
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            printf '%s %s\n' "$ADDON_TITLE" "$ADDON_VERSION" > "${RUNNER_TEMP}/notes.md"
          fi

          # 保存用 Release がまだ無い = この版を初めて公開する。
          # Discord へはこのときだけ自動で投稿する。同じ版で再実行（ノートの修正 / リラン）
          # するたびに流れると、チャンネルに同じお知らせが並ぶため。
          if gh release view "$ARCHIVE_TAG" >/dev/null 2>&1; then first_publish=false; else first_publish=true; fi

          {
            echo "first_publish=$first_publish"
            echo "asset_path=${RUNNER_TEMP}/${ADDON_ASSET}"
            echo "notes_path=${RUNNER_TEMP}/notes.md"
          } >> "$GITHUB_OUTPUT"
          echo "採用 .ipf: $ipf -> ${ADDON_ASSET}"

      - name: 移動タグのリリースを作り直す
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          ADDON_TITLE: ${{ matrix.title }}
          ADDON_VERSION: ${{ matrix.version }}
          ASSET_PATH: ${{ steps.meta.outputs.asset_path }}
          NOTES_PATH: ${{ steps.meta.outputs.notes_path }}
        run: |
          set -euo pipefail

          # 移動タグは「既存リリース + git タグごと削除 → 新コミットで作り直し」で更新する。
          # (published リリースの --target は既存タグを動かさないため、作り直すのが確実)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # Latest は移動タグ側に付ける。保存用リリースが増えても、素で開いたときに
          # 配布中の版が出るようにするため(既定は日付/版番号からの自動判定)。
          # **アドオンが複数あるので Latest は 1 つに決まらない**。ここでは「最後に公開した
          # 配布用リリース」が Latest になる（保存用が Latest を奪わないことが要点で、
          # どのアドオンが Latest かは意味を持たない。マネージャーは releaseTag で引く）。
          # タイトルに「配布用(最新)」を付けるのは、同じ版の保存用リリースと Releases 一覧で
          # 並んだときに、どちらがアドオンマネージャーの取得先か一目で分かるようにするため。
          gh release create "$TAG" \
            --title "${ADDON_TITLE} ${ADDON_VERSION} — 配布用（最新）" \
            --notes-file "$NOTES_PATH" \
            --target "$GITHUB_SHA" \
            --latest \
            "$ASSET_PATH"

      - name: 保存用タグのリリースを残す
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TAG: ${{ matrix.archive_tag }}
          ADDON_TITLE: ${{ matrix.title }}
          ADDON_VERSION: ${{ matrix.version }}
          ASSET_PATH: ${{ steps.meta.outputs.asset_path }}
          NOTES_PATH: ${{ steps.meta.outputs.notes_path }}
        run: |
          set -euo pipefail

          # 移動タグの Release は毎回消えるため、リリースノートと配布した .ipf を
          # 保存用タグ(<file>-vX.Y.Z)の Release として残す。
          # こちらはアドオンマネージャーからは参照されない(releaseTag は移動タグ固定)ので、
          # 純粋に記録用。Latest を奪わないよう --latest=false で作る。
          if gh release view "$ARCHIVE_TAG" >/dev/null 2>&1; then
            # 同じ版のまま再実行した場合(手動リラン / ノートの修正)は中身を今回のものに揃える。
            # タグ自体は既存の位置に残る(公開済みタグは動かさない)。
            gh release edit "$ARCHIVE_TAG" --notes-file "$NOTES_PATH" --latest=false
            gh release upload "$ARCHIVE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$ARCHIVE_TAG" \
              --title "${ADDON_TITLE} ${ADDON_VERSION}" \
              --notes-file "$NOTES_PATH" \
              --target "$GITHUB_SHA" \
              --latest=false \
              "$ASSET_PATH"
          fi

      # リリースノートの日本語セクションだけを Discord のチャンネルへ流す。
      # 公開（上の 2 ステップ）が済んでから送るので、ここが落ちても配布には影響しない。
      # 失敗したときや送り直したいときは、手動実行で discord にチェックを入れる
      # （ジョブの Re-run では、保存用 Release が既にあるので投稿されない）。
      - name: Discord へ日本語のリリースノートを投稿
        if: ${{ (github.event_name == 'push' && steps.meta.outputs.first_publish == 'true') || inputs.discord }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTES_PATH: ${{ steps.meta.outputs.notes_path }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ matrix.archive_tag }}
        run: python3 docs/post_release_discord.py "$NOTES_PATH" --link "$LINK"
